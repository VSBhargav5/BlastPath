name: BlastPath

on:
  pull_request:
    paths:
      - "**/*.py"

jobs:
  radius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Radius vs base
        run: |
          python -m blastpath radius . --git --against origin/${{ github.base_ref }} --hops 3 --format md -o radius.md || true
          cat radius.md || echo "no radius"
